services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/SimpleBlog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SimpleBlog;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      Jwt__Key: "docker-super-secret-key-change-me-please-32bytes!!"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  nextjs:
    build:
      context: ./frontend/nextjs
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5080/api"
    ports:
      - "3000:3000"
    depends_on:
      - api

  blazor:
    build:
      context: ./frontend/blazor
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - api
