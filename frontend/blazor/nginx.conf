server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so client-side routes work on refresh.
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Correct MIME type for the Blazor WebAssembly bundle.
    location /_framework/ {
        types {
            application/wasm wasm;
        }
    }
}
